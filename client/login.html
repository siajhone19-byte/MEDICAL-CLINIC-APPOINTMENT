<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Medical Health Center</title>
  <link rel="stylesheet" href="../login.css">
  <script src="../app.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="auth-page">
  <main class="auth-shell">

    <aside class="auth-aside">
      <a class="brand" href="index.html">
        <img src="../INDEX/logo.jpg" alt="Medical Health Center logo">

        <span class="brand-text">
          <strong>MEDICAL</strong>
          <span>CLINIC APPOINTMENT</span>
        </span>
      </a>

      <div class="hero-visual">
        <img class="doctor-image" src="../nurse.jpg" alt="Healthcare professional in a white coat">

        <div class="availability-card">
          <span class="status-dot"></span>
          <span>
            <strong>You can start your visit</strong>
            <small>Monday – Saturday · 8 AM – 5 PM</small>
          </span>
        </div>
      </div>
    </aside>
    <section class="form-panel">
      <div class="eyebrow">Patient portal</div>
      <h1>Welcome back.</h1>
      <p>Log in to manage your appointments.</p>
      <form class="form" id="login-form">
        <label>Email address<input type="email" name="email" placeholder="you@example.com" required></label>
        <label>Password<input type="password" name="password" placeholder="Enter your password" required></label>
        <button type="submit">Log in</button>
        <p class="form-message" id="auth-message" aria-live="polite"></p>
        <div class="form-note">New to the clinic? <a href="signup.html">Create an account</a></div>
      </form>
    </section>
  </main>
</body>

</html>
